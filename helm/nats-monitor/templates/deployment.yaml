apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nats-monitor.fullname" . }}
  labels:
    {{- include "nats-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nats-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nats-monitor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nats-monitor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: SERVER_CONTEXT_PATH
              value: {{ .Values.server.contextPath | quote }}
            - name: NATS_MONITORING_URL
              value: {{ .Values.nats.monitoringUrl | quote }}
            - name: NATS_SERVER_URL
              value: {{ .Values.nats.serverUrl | quote }}
            - name: NATS_SYSTEM_EVENTS_ENABLED
              value: {{ .Values.nats.systemEventsEnabled | quote }}
            - name: NATS_POLL_INTERVAL
              value: {{ .Values.nats.pollIntervalSeconds | quote }}
            - name: NATS_SNAPSHOT_RETENTION_HOURS
              value: {{ .Values.nats.snapshotRetentionHours | quote }}
            - name: NATS_TLS_ENABLED
              value: {{ .Values.nats.tls.enabled | quote }}
            - name: NATS_TLS_KEY_STORE_PATH
              value: {{ .Values.nats.tls.keyStorePath | quote }}
            - name: NATS_TLS_KEY_STORE_TYPE
              value: {{ .Values.nats.tls.keyStoreType | quote }}
            - name: NATS_TLS_TRUST_STORE_PATH
              value: {{ .Values.nats.tls.trustStorePath | quote }}
            - name: NATS_TLS_TRUST_STORE_TYPE
              value: {{ .Values.nats.tls.trustStoreType | quote }}
            - name: NATS_TLS_PROTOCOL
              value: {{ .Values.nats.tls.protocol | quote }}
            {{- if or .Values.nats.tls.keyStorePassword .Values.nats.tls.keyPassword .Values.nats.tls.trustStorePassword }}
            - name: NATS_TLS_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-nats-tls
                  key: key-store-password
            - name: NATS_TLS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-nats-tls
                  key: key-password
            - name: NATS_TLS_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-nats-tls
                  key: trust-store-password
            {{- else }}
            - name: NATS_TLS_KEY_STORE_PASSWORD
              value: ""
            - name: NATS_TLS_KEY_PASSWORD
              value: ""
            - name: NATS_TLS_TRUST_STORE_PASSWORD
              value: ""
            {{- end }}
            {{- if .Values.nats.username }}
            - name: NATS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-nats
                  key: username
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-nats
                  key: password
            {{- end }}
            - name: ALERTING_ENABLED
              value: {{ .Values.alerting.enabled | quote }}
            - name: ALERT_CHECK_INTERVAL
              value: {{ .Values.alerting.checkIntervalSeconds | quote }}
            - name: ALERT_STUCK_THRESHOLD
              value: {{ .Values.alerting.stuckThreshold | quote }}
            - name: ALERT_CONSUMER_LAG_THRESHOLD
              value: {{ .Values.alerting.consumerLagThreshold | quote }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            {{- if .Values.smtp.username }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-smtp
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nats-monitor.fullname" . }}-smtp
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.server.contextPath }}/actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.server.contextPath }}/actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nats-monitor.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
