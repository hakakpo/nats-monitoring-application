        - addColumn:
            tableName: alert_rules
            columns:
              - column:
                  name: webhook_url
                  type: VARCHAR(2048)
      rollback:
        - dropColumn:
            tableName: alert_rules
            columnName: webhook_url

  - changeSet:
      id: 002-add-alert-rules-webhook-enabled
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: alert_rules
            columnName: webhook_enabled
      changes:
        - addColumn:
            tableName: alert_rules
            columns:
              - column:
                  name: webhook_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: alert_rules
            columnName: webhook_enabled

  - changeSet:
      id: 002-add-alert-history-severity
