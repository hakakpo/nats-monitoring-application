      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: alert_history
            columnName: severity
      changes:
        - addColumn:
            tableName: alert_history
            columns:
              - column:
                  name: severity
                  type: VARCHAR(32)
                  defaultValue: WARNING
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: alert_history
