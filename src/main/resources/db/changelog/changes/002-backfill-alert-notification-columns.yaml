      changes:
        - addColumn:
            tableName: alert_history
            columns:
              - column:
                  name: resolved
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: alert_history
