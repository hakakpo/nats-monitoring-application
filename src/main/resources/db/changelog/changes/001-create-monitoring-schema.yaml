databaseChangeLog:
  - changeSet:
      id: 001-create-alert-rules
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: alert_rules
      changes:
        - createTable:
            tableName: alert_rules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: stream_name
                  type: VARCHAR(255)
              - column:
                  name: consumer_name
                  type: VARCHAR(255)
              - column:
                  name: threshold
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: VARCHAR(32)
                  defaultValue: WARNING
                  constraints:
                    nullable: false
              - column:
                  name: email_recipient
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: email_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: webhook_url
                  type: VARCHAR(2048)
              - column:
                  name: webhook_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: last_triggered
                  type: TIMESTAMP
              - column:
                  name: last_notified
                  type: TIMESTAMP
              - column:
                  name: cooldown_minutes
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: alert_rules

  - changeSet:
      id: 001-create-alert-history
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: alert_history
      changes:
        - createTable:
            tableName: alert_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: alert_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: stream_name
                  type: VARCHAR(255)
              - column:
                  name: consumer_name
                  type: VARCHAR(255)
              - column:
                  name: current_value
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: threshold
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: VARCHAR(32)
                  defaultValue: WARNING
                  constraints:
                    nullable: false
              - column:
                  name: resolved
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: email_sent_to
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email_sent
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: webhook_url
                  type: VARCHAR(2048)
              - column:
                  name: webhook_sent
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(255)
              - column:
                  name: triggered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: alert_history

