<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('NATS Monitor - Streams')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <h1>Streams</h1>
        <p>JetStream streams and their current state</p>
    </div>

    <div class="empty-state" th:if="${!connected}">
        <i class="bi bi-wifi-off d-block"></i>
        <p>Not connected to NATS server</p>
    </div>

    <div class="empty-state"
         th:if="${connected && (streams == null || streams.streams() == null || streams.streams().isEmpty())}">
        <i class="bi bi-collection d-block"></i>
        <p>No streams found</p>
    </div>

    <div class="row g-3" th:if="${connected && streams != null && streams.streams() != null}">
        <div class="col-md-6 col-lg-4" th:each="stream : ${streams.streams()}">
            <div class="data-card">
                <div class="data-card-header">
                    <h5 style="font-family: 'JetBrains Mono', monospace;" th:text="${stream.name()}">Stream</h5>
                    <span class="badge-status"
                          th:classappend="${stream.safeConfig().storage() == 'file'} ? 'file' : 'memory'"
                          th:text="${stream.safeConfig().storage() != null ? stream.safeConfig().storage() : 'unknown'}">unknown</span>
                </div>
                <div class="data-card-body">
                    <div class="info-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="info-item">
                            <div class="info-item-label">Messages</div>
                            <div class="info-item-value"
                                 th:text="${#numbers.formatInteger(stream.safeState().messages(), 1, 'COMMA')}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Size</div>
                            <div class="info-item-value"
                                 th:text="${formatBytes.formatBytes(stream.safeState().bytes())}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Consumers</div>
                            <div class="info-item-value" th:text="${stream.safeState().consumerCount()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label"
                                 title="Distinct concrete subjects currently stored in the stream state">Actual Subjects</div>
                            <div class="info-item-value"
                                 th:text="${#numbers.formatInteger(stream.actualSubjectCount(), 1, 'COMMA')}"
                                 th:title="${stream.configuredSubjectsLabel()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">First Seq</div>
                            <div class="info-item-value" th:text="${stream.safeState().firstSeq()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Last Seq</div>
                            <div class="info-item-value" th:text="${stream.safeState().lastSeq()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Retention</div>
                            <div class="info-item-value"
                                 th:text="${stream.safeConfig().retention() != null ? stream.safeConfig().retention() : '-'}">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Created</div>
                            <div class="info-item-value" style="font-size: 0.85rem;"
                                 th:text="${stream.created() != null && stream.created().length() >= 10 ? stream.created().substring(0, 10) : '-'}">-</div>
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <a class="btn-outline-custom" th:href="@{/streams/{name}(name=${stream.name()})}">
                            <i class="bi bi-eye me-1"></i>Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
