<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('NATS Monitor - Streams')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <h1>Streams</h1>
        <p>JetStream streams and their current state</p>
    </div>

    <div th:if="${!connected}" class="empty-state">
        <i class="bi bi-wifi-off d-block"></i>
        <p>Not connected to NATS server</p>
    </div>

    <div th:if="${connected && (streams == null || streams.streams() == null || streams.streams().isEmpty())}" class="empty-state">
        <i class="bi bi-collection d-block"></i>
        <p>No streams found</p>
    </div>

    <div th:if="${connected && streams != null && streams.streams() != null}" class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="stream : ${streams.streams()}">
            <div class="data-card">
                <div class="data-card-header">
                    <h5 style="font-family: 'JetBrains Mono', monospace;" th:text="${stream.name()}">Stream</h5>
                    <span class="badge-status" th:classappend="${stream.safeConfig().storage() == 'file'} ? 'file' : 'memory'" th:text="${stream.safeConfig().storage() != null ? stream.safeConfig().storage() : 'unknown'}">unknown</span>
                </div>
                <div class="data-card-body">
                    <div class="info-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="info-item">
                            <div class="info-item-label">Messages</div>
                            <div class="info-item-value" th:text="${#numbers.formatInteger(stream.safeState().messages(), 1, 'COMMA')}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Size</div>
                            <div class="info-item-value" th:text="${formatBytes.formatBytes(stream.safeState().bytes())}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Consumers</div>
                            <div class="info-item-value" th:text="${stream.safeState().consumerCount()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Subjects</div>
                            <div class="info-item-value" th:text="${stream.safeState().numSubjects()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">First Seq</div>
                            <div class="info-item-value" th:text="${stream.safeState().firstSeq()}">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Last Seq</div>
                            <div class="info-item-value" th:text="${stream.safeState().lastSeq()}">0</div>
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <a th:href="@{/streams/{name}(name=${stream.name()})}" class="btn-outline-custom">
                            <i class="bi bi-eye me-1"></i>Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
