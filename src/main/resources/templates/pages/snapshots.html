<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('NATS Monitor - Snapshots')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header"><h1>Snapshots</h1><p>Persisted server and consumer metric samples</p></div>
    <div class="data-card mb-4">
        <div class="data-card-header"><h5><i class="bi bi-hdd-network me-2"></i>Server Snapshots</h5><span class="badge-status info" th:text="|${#lists.size(serverSnapshots)} samples|">0</span></div>
        <div class="data-card-body p-0">
            <div class="empty-state" th:if="${#lists.isEmpty(serverSnapshots)}"><i class="bi bi-clock-history d-block"></i><p>No server snapshots yet</p></div>
            <table class="table-dark-custom" th:if="${!#lists.isEmpty(serverSnapshots)}">
                <thead><tr><th>Captured</th><th>Server</th><th>CPU</th><th>Memory</th><th>Connections</th><th>Slow</th><th>Streams</th><th>Consumers</th></tr></thead>
                <tbody>
                <tr th:each="snapshot : ${serverSnapshots}">
                    <td style="font-size: 0.8rem;" th:text="${#temporals.format(snapshot.capturedAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                    <td th:text="${snapshot.serverName != null ? snapshot.serverName : snapshot.serverId}">-</td>
                    <td th:text="${#numbers.formatDecimal(snapshot.cpu, 1, 1)}">0</td>
                    <td th:text="${formatBytes.formatBytes(snapshot.memoryBytes)}">0 B</td>
                    <td th:text="${snapshot.connections}">0</td>
                    <td><span th:class="${snapshot.slowConsumers > 0 ? 'badge-status warning' : ''}" th:text="${snapshot.slowConsumers}">0</span></td>
                    <td th:text="${snapshot.streams}">0</td>
                    <td th:text="${snapshot.consumers}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="data-card">
        <div class="data-card-header"><h5><i class="bi bi-people me-2"></i>Consumer Snapshots</h5><span class="badge-status info" th:text="|${#lists.size(consumerSnapshots)} samples|">0</span></div>
        <div class="data-card-body p-0">
            <div class="empty-state" th:if="${#lists.isEmpty(consumerSnapshots)}"><i class="bi bi-people d-block"></i><p>No consumer snapshots yet</p></div>
            <table class="table-dark-custom" th:if="${!#lists.isEmpty(consumerSnapshots)}">
                <thead><tr><th>Captured</th><th>Stream</th><th>Consumer</th><th>Lag</th><th>Pending</th><th>Ack Pending</th><th>Redelivered</th></tr></thead>
                <tbody>
                <tr th:each="snapshot : ${consumerSnapshots}">
                    <td style="font-size: 0.8rem;" th:text="${#temporals.format(snapshot.capturedAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                    <td th:text="${snapshot.streamName}">-</td>
                    <td th:text="${snapshot.consumerName}">-</td>
                    <td><span th:class="${snapshot.lag > 0 ? 'badge-status warning' : ''}" th:text="${snapshot.lag}">0</span></td>
                    <td th:text="${snapshot.pendingMessages}">0</td>
                    <td><span th:class="${snapshot.ackPending > 0 ? 'badge-status danger' : ''}" th:text="${snapshot.ackPending}">0</span></td>
                    <td><span th:class="${snapshot.redelivered > 0 ? 'badge-status danger' : ''}" th:text="${snapshot.redelivered}">0</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
