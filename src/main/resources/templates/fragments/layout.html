<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title}">NATS Monitor</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme');
            var theme = savedTheme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav class="sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-activity"></i>
        <span>NATS Monitor</span>
    </div>
    <ul class="sidebar-nav">
        <li th:classappend="${activePage == 'dashboard'} ? 'active'">
            <a th:href="@{/}"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        </li>
        <li th:classappend="${activePage == 'streams'} ? 'active'">
            <a th:href="@{/streams}"><i class="bi bi-collection"></i><span>Streams</span></a>
        </li>
        <li th:classappend="${activePage == 'connections'} ? 'active'">
            <a th:href="@{/connections}"><i class="bi bi-plug"></i><span>Connections</span></a>
        </li>
        <li th:classappend="${activePage == 'diagnostic'} ? 'active'">
            <a th:href="@{/diagnostic}"><i class="bi bi-heart-pulse"></i><span>Diagnostic</span></a>
        </li>
        <li th:classappend="${activePage == 'incidents'} ? 'active'">
            <a th:href="@{/incidents}"><i class="bi bi-exclamation-triangle"></i><span>Incidents</span></a>
        </li>
        <li th:classappend="${activePage == 'events'} ? 'active'">
            <a th:href="@{/events}"><i class="bi bi-broadcast"></i><span>Events</span></a>
        </li>
        <li th:classappend="${activePage == 'snapshots'} ? 'active'">
            <a th:href="@{/snapshots}"><i class="bi bi-clock-history"></i><span>Snapshots</span></a>
        </li>
        <li th:classappend="${activePage == 'alerts'} ? 'active'">
            <a th:href="@{/alerts}"><i class="bi bi-bell"></i><span>Alerts</span></a>
        </li>
    </ul>
    <div class="sidebar-footer">
        <div class="theme-toggle" id="themeToggle" role="button" tabindex="0"
             title="Basculer entre thème clair et sombre">
            <i class="bi bi-sun-fill"></i>
            <span class="theme-toggle-slider"></span>
            <i class="bi bi-moon-stars-fill"></i>
        </div>
        <div class="connection-status" id="connectionStatus">
            <span class="status-dot" th:classappend="${connected} ? 'connected' : 'disconnected'"></span>
            <span th:text="${connected} ? 'Connected' : 'Disconnected'">Status</span>
        </div>
    </div>
</nav>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:inline="javascript">
        window.__contextPath = /*[[@{/}]]*/ '/';
        // Remove trailing slash for clean concatenation
        if (window.__contextPath.length > 1 && window.__contextPath.endsWith('/')) {
            window.__contextPath = window.__contextPath.slice(0, -1);
        }
    </script>
    <script th:src="@{/js/app.js}"></script>
</footer>
</html>
