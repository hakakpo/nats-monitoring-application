server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/nats-monitoring}
spring:
  application:
    name: nats-monitoring
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nats-monitor-db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# NATS Monitoring Configuration
nats:
  monitoring:
    url: ${NATS_MONITORING_URL:http://localhost:8222}
    server-url: ${NATS_SERVER_URL:nats://localhost:4222}
    username: ${NATS_USERNAME:}
    password: ${NATS_PASSWORD:}
    system-events-enabled: ${NATS_SYSTEM_EVENTS_ENABLED:false}
    poll-interval-seconds: ${NATS_POLL_INTERVAL:5}
    snapshot-retention-hours: ${NATS_SNAPSHOT_RETENTION_HOURS:120}
    history-retention-days: ${NATS_HISTORY_RETENTION_DAYS:5}
    cleanup-interval-hours: ${NATS_CLEANUP_INTERVAL_HOURS:6}
    tls:
      enabled: ${NATS_TLS_ENABLED:false}
      key-store-path: ${NATS_TLS_KEY_STORE_PATH:}
      key-store-password: ${NATS_TLS_KEY_STORE_PASSWORD:}
      key-store-type: ${NATS_TLS_KEY_STORE_TYPE:PKCS12}
      key-password: ${NATS_TLS_KEY_PASSWORD:}
      trust-store-path: ${NATS_TLS_TRUST_STORE_PATH:}
      trust-store-password: ${NATS_TLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${NATS_TLS_TRUST_STORE_TYPE:PKCS12}
      protocol: ${NATS_TLS_PROTOCOL:TLS}

# Alerting defaults
alerting:
  enabled: ${ALERTING_ENABLED:true}
  check-interval-seconds: ${ALERT_CHECK_INTERVAL:30}
  default-stuck-threshold: ${ALERT_STUCK_THRESHOLD:1000}
  default-consumer-lag-threshold: ${ALERT_CONSUMER_LAG_THRESHOLD:5000}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
