server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/nats-monitoring}

spring:
  application:
    name: nats-monitoring-local
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nats-monitor-local-db;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

nats:
  monitoring:
    url: ${NATS_MONITORING_URL:http://localhost:8222}
    server-url: ${NATS_SERVER_URL:nats://localhost:4222}
    username: ${NATS_USERNAME:local}
    password: ${NATS_PASSWORD:local}
    system-events-enabled: ${NATS_SYSTEM_EVENTS_ENABLED:true}
    poll-interval-seconds: ${NATS_POLL_INTERVAL:5}
    snapshot-retention-hours: ${NATS_SNAPSHOT_RETENTION_HOURS:24}
    tls:
      enabled: ${NATS_TLS_ENABLED:false}
      key-store-path: ${NATS_TLS_KEY_STORE_PATH:}
      key-store-password: ${NATS_TLS_KEY_STORE_PASSWORD:}
      key-store-type: ${NATS_TLS_KEY_STORE_TYPE:PKCS12}
      key-password: ${NATS_TLS_KEY_PASSWORD:}
      trust-store-path: ${NATS_TLS_TRUST_STORE_PATH:}
      trust-store-password: ${NATS_TLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${NATS_TLS_TRUST_STORE_TYPE:PKCS12}
      protocol: ${NATS_TLS_PROTOCOL:TLS}

alerting:
  enabled: ${ALERTING_ENABLED:true}
  check-interval-seconds: ${ALERT_CHECK_INTERVAL:30}
  default-stuck-threshold: ${ALERT_STUCK_THRESHOLD:1000}
  default-consumer-lag-threshold: ${ALERT_CONSUMER_LAG_THRESHOLD:5000}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.natsmonitor: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: ${LOCAL_HIBERNATE_SQL_LOG_LEVEL:WARN}
